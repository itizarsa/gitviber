name: Release

# A pushed v* tag builds the universal macOS app, signs it with the self-signed
# `gitviber-codesign` certificate (no Apple Developer ID, so it isn't notarized; the Homebrew
# cask clears its quarantine), and publishes it as a GitHub release with its SHA-256.
# Casks/gitviber.rb in itizarsa/homebrew-tap points at it. Run from the Actions tab it's a dry
# run: the same build, kept as a workflow artifact, ad-hoc signed if the certificate is missing.
# Run with `publish` on, it releases the commit it built instead, creating its v<version> tag:
# for cutting a release where pushing a tag isn't possible.
#
# The certificate comes from the CODESIGN_P12_BASE64 and CODESIGN_P12_PASSWORD secrets. Every
# release has to carry the same identity, or macOS treats an update as a different app and asks
# again for what it granted the last one (folders, keychain items).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release, tagging this commit v<version>"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # A tag must match the version in package.json and Cargo.toml.
      - id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(node scripts/version.mjs check "$GITHUB_REF_NAME")
          else
            version=$(node scripts/version.mjs check)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Also applies the xterm.js patches in patches/.
      - run: pnpm install --frozen-lockfile

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::error::Set the CODESIGN_P12_BASE64 and CODESIGN_P12_PASSWORD secrets: a release must carry the gitviber-codesign identity."
              exit 1
            fi
            echo "::warning::No signing certificate, so this dry run is ad-hoc signed."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          umask 077
          keychain="$RUNNER_TEMP/codesign.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/codesign.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$RUNNER_TEMP/codesign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          existing=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086 # one path per word
          security list-keychains -d user -s "$keychain" $existing
          echo "APPLE_SIGNING_IDENTITY=gitviber-codesign" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Check the signature
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/GitViber.app
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -E "^(Authority|Signature)=" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checksum
        id: dmg
        run: |
          dmg=$(echo src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          sha=$(shasum -a 256 "$dmg" | cut -d' ' -f1)
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha  $(basename "$dmg")" > SHA256SUMS
          { echo "### $(basename "$dmg")"; echo; echo "SHA-256: \`$sha\`"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GitViber-${{ steps.version.outputs.version }}-macos
          path: |
            ${{ steps.dmg.outputs.path }}
            SHA256SUMS

      # A tag's own, or one this run creates on the commit it built (gh makes the tag; a tag made
      # with the workflow's token doesn't start this workflow again).
      - name: Publish the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          node scripts/release-notes.mjs "$tag" > notes.md 2>/dev/null || echo "GitViber fork $VERSION." > notes.md
          gh release create "$tag" "${{ steps.dmg.outputs.path }}" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GitViber $VERSION" --notes-file notes.md
